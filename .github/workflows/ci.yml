name: Check and package
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  package:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            architectures: --arm64 --x64
          - os: windows-latest
            platform: win
            architectures: --x64
          - os: ubuntu-latest
            platform: linux
            architectures: --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Tag does not match package version")'
      - run: pnpm build
      - name: Configure macOS credentials
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'JS'
          const { appendFileSync } = require("node:fs");
          const { randomUUID } = require("node:crypto");
          for (const [source, target] of [
            ["MAC_CSC_LINK", "CSC_LINK"],
            ["MAC_CSC_KEY_PASSWORD", "CSC_KEY_PASSWORD"],
            ["APPLE_ID", "APPLE_ID"],
            ["APPLE_APP_SPECIFIC_PASSWORD", "APPLE_APP_SPECIFIC_PASSWORD"],
            ["APPLE_TEAM_ID", "APPLE_TEAM_ID"],
          ]) {
            const value = process.env[source];
            if (!value) continue;
            const delimiter = `freebo-${randomUUID()}`;
            appendFileSync(process.env.GITHUB_ENV, `${target}<<${delimiter}\n${value}\n${delimiter}\n`);
          }
          JS
      - run: pnpm exec electron-builder --${{ matrix.platform }} ${{ matrix.architectures }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: freebo-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --draft --generate-notes release/*
